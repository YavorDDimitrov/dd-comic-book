<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DD and the New Adventure — A Sci-Fi Birthday Tale</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage">

  <!-- starfield background -->
  <canvas id="stars"></canvas>

  <!-- mute button, always present -->
  <button id="mute-btn" aria-label="Mute background music" aria-pressed="false">
    <svg id="icon-on" viewBox="0 0 24 24" width="22" height="22"><path d="M3 10v4h4l5 5V5L7 10H3z" fill="currentColor"/><path d="M16.5 12a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12z" fill="currentColor"/><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" fill="currentColor"/></svg>
    <svg id="icon-off" viewBox="0 0 24 24" width="22" height="22" style="display:none"><path d="M3 10v4h4l5 5V5L7 10H3z" fill="currentColor"/><path d="M19.5 12l2.5-2.5-1.4-1.4L18 10.6l-2.5-2.5-1.4 1.4L16.6 12l-2.5 2.5 1.4 1.4L18 13.4l2.5 2.5 1.4-1.4L19.4 12z" fill="currentColor"/></svg>
  </button>

  <!-- book wrapper: handles the spin-into-view entrance -->
  <div id="book-wrap">
    <div id="perspective">
      <div id="book">
        <div id="pages">
          <!-- pages injected by JS, in order: cover, page1..page6 -->
        </div>
      </div>
    </div>
  </div>

  <!-- nav arrows -->
  <button id="prev-btn" class="nav-arrow" aria-label="Previous page">
    <svg viewBox="0 0 24 24" width="28" height="28"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="next-btn" class="nav-arrow" aria-label="Next page">
    <svg viewBox="0 0 24 24" width="28" height="28"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <!-- shown only on the back cover, in place of the next arrow -->
  <button id="restart-btn" class="hidden" aria-label="Start from beginning">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 4v6h6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 20A9 9 0 1 0 5.5 6.5L4 10" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Start from beginning</span>
  </button>

  <!-- page counter -->
  <div id="page-counter"></div>

  <!-- tap-to-start overlay, required by browsers to allow audio -->
  <div id="start-overlay">
    <div id="start-card">
      <div class="start-title">DD AND THE NEW ADVENTURE</div>
      <div class="start-sub">A Sci-Fi Birthday Tale</div>
      <button id="start-btn">ENTER ▸</button>
      <div class="start-hint">Turns on music &amp; opens the book</div>
    </div>
  </div>

</div>

<audio id="bg-audio" src="assets/audio/background_tune.mp3" loop preload="auto"></audio>

<script src="js/script.js"></script>
</body>
</html>
