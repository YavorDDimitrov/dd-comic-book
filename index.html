<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Tale of DD and the Seven Companions — A Birthday Fairytale</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage">

  <!-- starfield background -->
  <canvas id="stars"></canvas>

  <!-- fireworks burst, played once the back cover is reached -->
  <canvas id="fireworks"></canvas>

  <!-- mute button, always present -->
  <button id="mute-btn" aria-label="Play/Pause background music" aria-pressed="false">
    <svg id="icon-play" viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
    <svg id="icon-pause" viewBox="0 0 24 24" width="22" height="22" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" fill="currentColor"/></svg>
  </button>

  <!-- book wrapper: handles the spin-into-view entrance -->
  <div id="book-wrap">
    <div id="perspective">
      <div id="book">
        <!-- left slot: only populated/shown in desktop two-page spread mode -->
        <div id="pages-left" class="book-slot"></div>
        <!-- right slot: the interactive stack. Full width in single-page (mobile) mode. -->
        <div id="pages-right" class="book-slot"></div>
      </div>
    </div>
  </div>

  <!-- nav arrows -->
  <button id="prev-btn" class="nav-arrow" aria-label="Previous page">
    <svg viewBox="0 0 24 24" width="28" height="28"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="next-btn" class="nav-arrow" aria-label="Next page">
    <svg viewBox="0 0 24 24" width="28" height="28"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <!-- shown only on the back cover, in place of the next arrow -->
  <button id="restart-btn" class="hidden" aria-label="Start from beginning">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 4v6h6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 20A9 9 0 1 0 5.5 6.5L4 10" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Start from beginning</span>
  </button>

  <!-- page counter -->
  <div id="page-counter"></div>

</div>

<audio id="bg-audio" src="assets/audio/background_tune.mp3" loop preload="auto" playsinline></audio>

<script src="js/script.js"></script>
</body>
</html>
